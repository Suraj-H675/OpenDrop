[package]
name = "opendrop-android-sender"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["rlib", "cdylib"]

[features]
hosted-guest-fixture = ["opendrop-core/hosted-guest-fixture"]

[dependencies]
opendrop-core = { path = "../opendrop-core" }
rustls = { version = "=0.23.45", default-features = false, features = ["std", "ring"] }
ring = "=0.17.14"
sha2 = "=0.10.9"
thiserror = "=2.0.21"

[target.'cfg(target_os = "android")'.dependencies]
jni = "=0.21.1"

[dev-dependencies]
tempfile = "=3.27.0"
