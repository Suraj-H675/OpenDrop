name: D-148 real discovery to authenticated transfer (hosted only)
on:
  push:
    branches:
      - verification/d148-discovery-e2e-20261116
permissions:
  contents: read
  attestations: write
  id-token: write
concurrency:
  group: opendrop-d148-real-network
  cancel-in-progress: false

jobs:
  network-namespace-discovery-to-transfer:
    runs-on: ubuntu-24.04
    timeout-minutes: 32
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Guard exact revision and private source exclusion
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/verification/d148-discovery-e2e-20261116
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test ! -e AGENTS.md && test ! -e .opendrop-private
          test "$(id -u)" -ne 0
      - name: Install only hosted runner Rust/Qt and isolated netns prerequisites
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal --component rustfmt
          rustup default stable
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends qt6-base-dev libsystemd-dev iproute2
          test -x "$(command -v ip)"
      - name: Compile actual production Rust receiver/sender test harness once
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo test -p opendrop-linux-receiver --bin opendrop-linux-receiver             --features hosted-guest-fixture --locked --no-run --message-format=json             > "$RUNNER_TEMP/d148-cargo-fixtures.jsonl"
          python3 - "$GITHUB_ENV" <<'PYBIN'
          import os,pathlib,subprocess,sys
          # Cargo also emits build-script / CMake artifacts. Selecting by
          # target name alone can accidentally execute a build helper.
          # Require the REAL test harness to list both exact D148 tests.
          candidates=[]
          for path in pathlib.Path("target/debug/deps").glob("opendrop_linux_receiver-*"):
            if not path.is_file() or not os.access(path,os.X_OK):
              continue
            with path.open('rb') as source:
              if source.read(4)!=b'\x7fELF': continue
            listed=subprocess.run([str(path),'--list'],capture_output=True,
                                  text=True,timeout=10,check=True)
            if all(name in listed.stdout for name in (
              'runtime::d148_netns_fixture::hosted_receiver_process_real_udp_tcp_tls_file',
              'runtime::d148_netns_fixture::hosted_sender_process_real_udp_tcp_tls_file')):
              candidates.append(path.resolve())
          assert len(candidates)==1,candidates
          with open(sys.argv[1],'a') as out:
            out.write('D148_TEST_BINARY='+str(candidates[0])+'\n')
          print('D148_REAL_TEST_HARNESS_BINARY='+str(candidates[0]))
          PYBIN
      - name: Real received UDP, physical TCP both directions, production TLS/SAS/file/receipt and negative netns tests
        env:
          D148_HOSTED_CI_ONLY: isolated
        shell: bash
        run: |
          set -euo pipefail
          bash .github/scripts/d148-hosted-netns.sh
      - name: Verify fixture remains excluded from compiled release executables
        shell: bash
        run: |
          set -euo pipefail
          cargo build -p opendrop-linux-receiver --bin opendrop-linux-receiver --release --locked
          if cargo build -p opendrop-linux-receiver --bin opendrop-linux-receiver                --release --locked --features hosted-guest-fixture > "$RUNNER_TEMP/unsafe.log" 2>&1; then
            echo 'CI-only identity/virtual-network fixture leaked into RELEASE!' >&2; exit 1
          fi
          grep -F 'hosted-guest-fixture is forbidden for production release builds' "$RUNNER_TEMP/unsafe.log"
          echo D148_RELEASE_BUILD_WITH_HOSTED_FIXTURE=BLOCKED
          # NO hosted netns can remain: only the test runner was allowed to
          # create these disposable virtual links.
          test -z "$(sudo ip netns list | grep od148 || true)"
  windows-cng-wire-contract:

    runs-on: windows-2022
    timeout-minutes: 22
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Validate exact branch SHA, private-file absence
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_REF -ne 'refs/heads/verification/d148-discovery-e2e-20261116') { throw 'wrong branch' }
          if ((git rev-parse HEAD) -ne $env:GITHUB_SHA) { throw 'wrong source SHA' }
          foreach ($path in @('AGENTS.md','.opendrop-private','private','research')) {
            if (Test-Path -LiteralPath $path) { throw "private file present: $path" }
          }
      - name: Windows Server MSVC CNG P256 signer runtime and core regressions
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt
          rustup default stable
          cargo fmt --all -- --check
          if ($LASTEXITCODE -ne 0) { throw 'Rust formatting failed' }
          cargo test -p opendrop-core --locked
          if ($LASTEXITCODE -ne 0) { throw 'CNG signing/runtime or shared Rust tests failed' }
      - name: Retain native x64 Explorer compilation baseline
        run: |
          cmake -S apps/windows/explorer -B "$env:RUNNER_TEMP/OpenDropExplorer" -G 'Visual Studio 17 2022' -A x64
          if ($LASTEXITCODE -ne 0) { throw 'Explorer CMake configuration failed' }
          cmake --build "$env:RUNNER_TEMP/OpenDropExplorer" --config Release --parallel 2
          if ($LASTEXITCODE -ne 0) { throw 'Explorer DLL compilation failed' }
          if (!(Test-Path "$env:RUNNER_TEMP/OpenDropExplorer/Release/OpenDropExplorer.dll")) { throw 'Explorer DLL missing' }
          Write-Host 'Windows Server CNG/Explorer build only. No Windows11 GUI, TPM or installation.'

  linux-native-rust-tls:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Exact branch and no private project sources
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/verification/d148-discovery-e2e-20261116
          test "$(git -c safe.directory="$GITHUB_WORKSPACE" rev-parse HEAD)" = "$GITHUB_SHA"
          test ! -e AGENTS.md && test ! -e .opendrop-private
      - name: Rust stable and disposable Qt6 native dependencies
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal --component rustfmt
          rustup default stable
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends qt6-base-dev libsystemd-dev
      - name: Locked shared protocol, actual Linux reverse TCP TLS and Android sender fixture tests
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo test -p opendrop-core -p opendrop-linux-receiver -p opendrop-android-sender --locked
          cargo test -p opendrop-linux-receiver --bin opendrop-linux-receiver --features hosted-guest-fixture --locked
          cargo build -p opendrop-linux-receiver --bin opendrop-linux-receiver --locked
      - name: Headless native Qt foreground consent boundary regressions
        shell: bash
        run: |
          set -euo pipefail
          cmake -S apps/linux/receiver/ui -B "$RUNNER_TEMP/qt-d148" -DOPENDROP_BUILD_QT_TESTS=ON
          cmake --build "$RUNNER_TEMP/qt-d148" --parallel 2
          ctest --test-dir "$RUNNER_TEMP/qt-d148" --output-on-failure

  kde6-protected-provider:
    runs-on: ubuntu-24.04
    container: fedora:43
    timeout-minutes: 24
    steps:
      - name: Install native CI-only KDE development dependencies
        run: |
          set -euo pipefail
          dnf -y --setopt=install_weak_deps=False install \
            git rust cargo rustfmt gcc gcc-c++ clang make cmake \
            pkgconf-pkg-config qt6-qtbase-devel kf6-kwallet-devel \
            systemd-devel openssl-devel
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Compile actual optional KWallet6 library, protected P256 signer and fail-closed tests
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/verification/d148-discovery-e2e-20261116
          # Container checkout bind mount may be root-owned; trust ONLY
          # this exact disposable runner checkout for SHA verification.
          test "$(git -c safe.directory="$GITHUB_WORKSPACE" rev-parse HEAD)" = "$GITHUB_SHA"
          test ! -e AGENTS.md && test ! -e .opendrop-private
          # NEVER open a wallet or spawn GPG agent in hosted CI. Only
          # compile production KWallet6 integration and use in-memory Rust
          # cryptographic vectors in #[cfg(test)].
          cargo test -p opendrop-linux-receiver --bin opendrop-linux-receiver \
            --features kwallet-gpg --locked
          cargo build -p opendrop-linux-receiver --bin opendrop-linux-receiver \
            --features kwallet-gpg --locked

  android-arm64-art-provenance:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Require exact approved source-only verification branch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/verification/d148-discovery-e2e-20261116
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test ! -e AGENTS.md && test ! -e .opendrop-private
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d
        with:
          gradle-version: '8.11.1'
      - name: Enable KVM only on disposable hosted runner
        shell: bash
        run: |
          set -euo pipefail
          test -c /dev/kvm
          sudo chmod 0666 /dev/kvm
      - name: Production ARM64+x86 AndroidKeyStore JNI build and Java source
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal --component rustfmt
          rustup default stable
          rustup target add aarch64-linux-android x86_64-linux-android
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          ndk="$(find "$sdk/ndk" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          bin="$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$bin/aarch64-linux-android26-clang"
          export CARGO_TARGET_X86_64_LINUX_ANDROID_LINKER="$bin/x86_64-linux-android26-clang"
          export CC_aarch64_linux_android="$bin/aarch64-linux-android26-clang"
          export CC_x86_64_linux_android="$bin/x86_64-linux-android26-clang"
          export AR_aarch64_linux_android="$bin/llvm-ar"
          export AR_x86_64_linux_android="$bin/llvm-ar"
          cargo build -p opendrop-android-sender --locked --release --target aarch64-linux-android
          cargo build -p opendrop-android-sender --locked --release --target x86_64-linux-android
          mkdir -p apps/android/build/generated/opendrop-jni/{arm64-v8a,x86_64}
          cp target/aarch64-linux-android/release/libopendrop_android_sender.so apps/android/build/generated/opendrop-jni/arm64-v8a/libopendrop_android_guest.so
          cp target/x86_64-linux-android/release/libopendrop_android_sender.so apps/android/build/generated/opendrop-jni/x86_64/libopendrop_android_guest.so
          for so in apps/android/build/generated/opendrop-jni/{arm64-v8a,x86_64}/libopendrop_android_guest.so; do
            exports="$(readelf --wide --dyn-syms "$so")"
            grep -F Java_org_opendrop_app_GuestNative_sendHotspot <<< "$exports"
            grep -F Java_org_opendrop_app_GuestNative_recoverHotspot <<< "$exports"
            grep -F Java_org_opendrop_app_GuestNative_identitySelfTest <<< "$exports"
          done
          gradle --no-daemon -p apps/android assembleNormalDebug assembleNormalDebugAndroidTest lintNormalDebug
      - name: Isolated Android 35 ART actual native signer and deny-route smoke
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_5
          ram-size: 2048M
          disk-size: 4096M
          emulator-boot-timeout: 600
          disable-animations: true
          script: |
            bash .github/scripts/s1g-hosted-android.sh
      - name: Inspect built normal APK without publishing connected-device artifact
        shell: bash
        run: |
          set -euo pipefail
          apk=apps/android/build/outputs/apk/normal/debug/OpenDropAndroid-normal-debug.apk
          test -s "$apk"
          sha256sum "$apk"
          zipinfo -1 "$apk" | grep -F 'lib/arm64-v8a/libopendrop_android_guest.so'
          zipinfo -1 "$apk" | grep -F 'lib/x86_64/libopendrop_android_guest.so'
          aapt="$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)"
          "$aapt" dump badging "$apk" | grep -F "package: name='org.opendrop.app'"
          "$aapt" dump permissions "$apk" | grep -F 'android.permission.INTERNET'
          if "$aapt" dump permissions "$apk" | grep -E 'android.permission.(MANAGE_EXTERNAL_STORAGE|READ_EXTERNAL_STORAGE|WRITE_EXTERNAL_STORAGE)'; then
            echo 'unexpected broad external-storage permission' >&2; exit 1
          fi
          echo D147_APK_COMPILED_NOT_RELEASED
