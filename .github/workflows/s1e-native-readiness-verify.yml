name: S1-E hosted Android ART and Windows CNG source/runtime checks

on:
  push:
    branches:
      - verification/s1e-native-readiness-20261115

permissions:
  contents: read

concurrency:
  group: s1e-native-readiness-branch
  cancel-in-progress: false

jobs:
  windows-native-cng:
    runs-on: windows-2022
    timeout-minutes: 22
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Validate exact branch SHA, private-file absence
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_REF -ne 'refs/heads/verification/s1e-native-readiness-20261115') { throw 'wrong branch' }
          if ((git rev-parse HEAD) -ne $env:GITHUB_SHA) { throw 'wrong source SHA' }
          foreach ($path in @('AGENTS.md','.opendrop-private','private','research')) {
            if (Test-Path -LiteralPath $path) { throw "private file present: $path" }
          }
      - name: Windows Server MSVC CNG P256 signer runtime and core regressions
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt
          rustup default stable
          cargo fmt --all -- --check
          if ($LASTEXITCODE -ne 0) { throw 'Rust formatting failed' }
          cargo test -p opendrop-core --locked
          if ($LASTEXITCODE -ne 0) { throw 'CNG signing/runtime or shared Rust tests failed' }
      - name: Retain native x64 Explorer compilation baseline
        run: |
          cmake -S apps/windows/explorer -B "$env:RUNNER_TEMP/OpenDropExplorer" -G 'Visual Studio 17 2022' -A x64
          if ($LASTEXITCODE -ne 0) { throw 'Explorer CMake configuration failed' }
          cmake --build "$env:RUNNER_TEMP/OpenDropExplorer" --config Release --parallel 2
          if ($LASTEXITCODE -ne 0) { throw 'Explorer DLL compilation failed' }
          if (!(Test-Path "$env:RUNNER_TEMP/OpenDropExplorer/Release/OpenDropExplorer.dll")) { throw 'Explorer DLL missing' }
          Write-Host 'Windows Server CNG/Explorer build only. No Windows11 GUI, TPM or installation.'

  android-hosted-art:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Runner-local Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - name: Runner-local Gradle 8.11.1
        uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d
        with:
          gradle-version: '8.11.1'
      - name: Cross compile actual Android JNI for arm64 and emulator x86-64
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal --component rustfmt
          rustup default stable
          rustup target add aarch64-linux-android x86_64-linux-android
          sdk="$(printenv ANDROID_HOME || printenv ANDROID_SDK_ROOT)"
          test -n "$sdk"
          ndk="$(find "$sdk/ndk" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          test -n "$ndk"
          bin="$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin"
          test -x "$bin/aarch64-linux-android26-clang"
          test -x "$bin/x86_64-linux-android26-clang"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$bin/aarch64-linux-android26-clang"
          export CARGO_TARGET_X86_64_LINUX_ANDROID_LINKER="$bin/x86_64-linux-android26-clang"
          export CC_aarch64_linux_android="$bin/aarch64-linux-android26-clang"
          export CC_x86_64_linux_android="$bin/x86_64-linux-android26-clang"
          export AR_aarch64_linux_android="$bin/llvm-ar"
          export AR_x86_64_linux_android="$bin/llvm-ar"
          cargo fmt --all -- --check
          cargo build -p opendrop-android-sender --target aarch64-linux-android --release --locked
          cargo build -p opendrop-android-sender --target x86_64-linux-android --release --locked
          mkdir -p apps/android/build/generated/opendrop-jni/{arm64-v8a,x86_64}
          cp target/aarch64-linux-android/release/libopendrop_android_sender.so apps/android/build/generated/opendrop-jni/arm64-v8a/libopendrop_android_guest.so
          cp target/x86_64-linux-android/release/libopendrop_android_sender.so apps/android/build/generated/opendrop-jni/x86_64/libopendrop_android_guest.so
          readelf --wide --syms apps/android/build/generated/opendrop-jni/x86_64/libopendrop_android_guest.so | grep -F 'Java_org_opendrop_app_GuestNative_identitySelfTest'
      - name: Strict Gradle verification, production APK, instrumentation APK and lint
        run: gradle --no-daemon -p apps/android assembleDebug assembleDebugAndroidTest lintDebug
      - name: Verify Android APK and AndroidTest packaging before emulator
        shell: bash
        run: |
          set -euo pipefail
          apk=apps/android/build/outputs/apk/debug/OpenDropAndroid-debug.apk
          testapk=apps/android/build/outputs/apk/androidTest/debug/OpenDropAndroid-debug-androidTest.apk
          test -s "$apk"
          test -s "$testapk"
          unzip -l "$apk" | grep -F 'lib/arm64-v8a/libopendrop_android_guest.so'
          unzip -l "$apk" | grep -F 'lib/x86_64/libopendrop_android_guest.so'
          unzip -l "$testapk" | grep -F 'classes.dex'
      - name: Enable KVM acceleration on disposable GitHub runner only
        shell: bash
        run: |
          set -euo pipefail
          # As documented by reactivecircus/android-emulator-runner, standard
          # hosted Ubuntu may expose /dev/kvm but restrict its group permissions.
          # The prior run timed out booting because user access was denied.
          test -c /dev/kvm
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -r /dev/kvm
          test -w /dev/kvm
          ls -l /dev/kvm
      - name: Disposable x86-64 Android API35 emulator with real ART instrumentation
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # reviewed v2.38.0
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_5
          ram-size: 2048M
          disk-size: 4096M
          emulator-boot-timeout: 600
          disable-animations: true
          script: |
            # reactivecircus executes EACH script line in a separate /bin/sh.
            # Use exactly one command so variables/loops/failures are scoped
            # together and no stage can silently be skipped.
            bash .github/scripts/s1e-android-art.sh
