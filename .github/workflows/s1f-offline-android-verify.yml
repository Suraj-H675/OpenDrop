name: S1-F owner offline APK and Android recovery verification (hosted only)
on:
  push:
    branches: [verification/s1f-offline-smoke-20261116]

permissions:
  contents: read
  id-token: write
  attestations: write
concurrency:
  group: s1f-owner-offline-apk
  cancel-in-progress: false

jobs:
  shared-rust-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Exact verified branch and public-only checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/verification/s1f-offline-smoke-20261116
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test ! -e AGENTS.md && test ! -e .opendrop-private
      - name: Shared Rust secure transfer, receipts and hosted fixtures regression
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal --component rustfmt
          rustup default stable
          cargo fmt --all -- --check
          cargo test --locked -p opendrop-core -p opendrop-android-sender
          cargo test --locked -p opendrop-android-sender --features hosted-guest-fixture

  android-offline-artifact:
    runs-on: ubuntu-24.04
    timeout-minutes: 39
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify exact public source SHA and branch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/verification/s1f-offline-smoke-20261116
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test ! -e AGENTS.md && test ! -e .opendrop-private
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d
        with:
          gradle-version: '8.11.1'
      - name: Enable KVM in disposable GitHub runner only
        shell: bash
        run: |
          set -euo pipefail
          test -c /dev/kvm
          sudo chmod 0666 /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
      - name: Build real ARM64 and emulator x86-64 production and offline JNI
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal --component rustfmt
          rustup default stable
          rustup target add aarch64-linux-android x86_64-linux-android
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          ndk="$(find "$sdk/ndk" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          test -n "$ndk"
          bin="$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$bin/aarch64-linux-android26-clang"
          export CARGO_TARGET_X86_64_LINUX_ANDROID_LINKER="$bin/x86_64-linux-android26-clang"
          export CC_aarch64_linux_android="$bin/aarch64-linux-android26-clang"
          export CC_x86_64_linux_android="$bin/x86_64-linux-android26-clang"
          export AR_aarch64_linux_android="$bin/llvm-ar"
          export AR_x86_64_linux_android="$bin/llvm-ar"
          cargo fmt --all -- --check
          # Production variant retains the complete secure sender; compile
          # it separately, then do NOT ship its JNI into offlineSmoke.
          cargo build -p opendrop-android-sender --locked --release --target aarch64-linux-android
          cargo build -p opendrop-android-sender --locked --release --target x86_64-linux-android
          mkdir -p apps/android/build/generated/opendrop-jni/{arm64-v8a,x86_64}
          cp target/aarch64-linux-android/release/libopendrop_android_sender.so apps/android/build/generated/opendrop-jni/arm64-v8a/libopendrop_android_guest.so
          cp target/x86_64-linux-android/release/libopendrop_android_sender.so apps/android/build/generated/opendrop-jni/x86_64/libopendrop_android_guest.so
          readelf --wide --dyn-syms apps/android/build/generated/opendrop-jni/x86_64/libopendrop_android_guest.so | grep -F Java_org_opendrop_app_GuestNative_sendOne
          gradle --no-daemon -p apps/android assembleNormalDebug assembleNormalDebugAndroidTest lintNormalDebug
          # Build a separate native shared library with NO sender, recovery
          # or network JNI modules. Validate raw exports before packaging.
          cargo build -p opendrop-android-sender --locked --release --features offline-smoke --target aarch64-linux-android
          cargo build -p opendrop-android-sender --locked --release --features offline-smoke --target x86_64-linux-android
          cp target/aarch64-linux-android/release/libopendrop_android_sender.so apps/android/build/generated/opendrop-jni/arm64-v8a/libopendrop_android_guest.so
          cp target/x86_64-linux-android/release/libopendrop_android_sender.so apps/android/build/generated/opendrop-jni/x86_64/libopendrop_android_guest.so
          for so in apps/android/build/generated/opendrop-jni/{arm64-v8a,x86_64}/libopendrop_android_guest.so; do
            exports="$(readelf --wide --dyn-syms "$so")"
            grep -F Java_org_opendrop_app_GuestNative_identitySelfTest <<< "$exports"
            if grep -E 'Java_org_opendrop_app_GuestNative_(sendOne|recoverOne|cancel)|opendrop_android_owner_confirm_sas' <<< "$exports"; then
              echo 'FATAL: Network-capable JNI exported by offline binary' >&2; exit 1
            fi
          done
      - name: Gradle offline owner APK plus test APK and strict lint
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon -p apps/android assembleOfflineSmokeDebug assembleOfflineSmokeDebugAndroidTest lintOfflineSmokeDebug
          test -s apps/android/build/outputs/apk/offlineSmoke/debug/OpenDropAndroid-offlineSmoke-debug.apk
          test -s apps/android/build/outputs/apk/androidTest/offlineSmoke/debug/OpenDropAndroid-offlineSmoke-debug-androidTest.apk
      - name: Disposable Android 35 x86-64 ART offline-only Keystore/JNI/ContentResolver verification
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_5
          ram-size: 2048M
          disk-size: 4096M
          emulator-boot-timeout: 600
          disable-animations: true
          script: |
            bash .github/scripts/s1f-offline-art.sh
      - name: Exact offline APK signing, package, permissions and provenance
        shell: bash
        run: bash .github/scripts/s1f-apk-provenance.sh
      - name: Upload ONLY offline test APK and nonsecret provenance record
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: s1f-offline-owner-apk
          path: |
            ${{ env.S1F_OWNER_ARTIFACT_DIR }}/OpenDrop-S1F-OfflineSmoke-ARM64.apk
            ${{ env.S1F_OWNER_ARTIFACT_DIR }}/S1F_APK_PROVENANCE.txt
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - name: Optional GitHub builder provenance attestation (no credentials)
        continue-on-error: true
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be
        with:
          subject-path: ${{ env.S1F_OWNER_ARTIFACT_DIR }}/OpenDrop-S1F-OfflineSmoke-ARM64.apk
