name: S1-A Rust Linux verification

on:
  push:
    branches:
      - verification/s1a-rust-20261113

permissions:
  contents: read

jobs:
  verify-opendrop-core:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the exact pushed revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Verify branch and commit identity
        shell: bash
        run: |
          test "$GITHUB_REF" = 'refs/heads/verification/s1a-rust-20261113'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          printf 'Verified GITHUB_SHA=%s\n' "$GITHUB_SHA"

      - name: Install runner-local Rust toolchain
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt
          rustup default stable

      - name: Record runner and Rust environment
        shell: bash
        run: |
          cat /etc/os-release
          rustc --version
          cargo --version
          rustfmt --version

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Run core unit, security and documentation tests
        run: cargo test -p opendrop-core --locked
