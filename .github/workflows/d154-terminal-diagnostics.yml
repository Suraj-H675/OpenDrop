name: D-154 hosted-only nearby observability and platform regression (NO owner hardware)
on:
  push:
    branches:
      - verification/d154-terminal-diagnostics-20261121
permissions:
  contents: read
  attestations: write
  id-token: write
concurrency:
  group: opendrop-d154-terminal-diagnostics
  cancel-in-progress: false

jobs:
  network-namespace-discovery-to-transfer:
    runs-on: ubuntu-24.04
    timeout-minutes: 32
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Guard exact revision and private source exclusion
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/verification/d154-terminal-diagnostics-20261121
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor 27dadd8197a96876d14ba97cb6c51bd8d03553db "$GITHUB_SHA"
          git merge-base --is-ancestor 8a417b9a33dc3fe66f2fc306cf79051a8cc12307 "$GITHUB_SHA"
          test ! -e AGENTS.md && test ! -e .opendrop-private
          test "$(id -u)" -ne 0
      - name: Install only hosted runner Rust/Qt and isolated netns prerequisites
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal --component rustfmt
          rustup default stable
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends qt6-base-dev libsystemd-dev iproute2
          test -x "$(command -v ip)"
      - name: Compile actual production Rust receiver/sender test harness once
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo test -p opendrop-linux-receiver --bin opendrop-linux-receiver             --features hosted-guest-fixture --locked --no-run --message-format=json             > "$RUNNER_TEMP/d148-cargo-fixtures.jsonl"
          python3 - "$RUNNER_TEMP/d148-cargo-fixtures.jsonl" "$GITHUB_ENV" <<'PYBIN'
          import json,os,pathlib,subprocess,sys
          # Do NOT assume a runner's Cargo target directory is ./target.
          # Inspect actual Cargo compiler-artifact executable paths and
          # prove --list includes BOTH test-only process endpoints before
          # ever granting a disposable network namespace.
          artifacts=[json.loads(line) for line in open(sys.argv[1]) if line.startswith('{')]
          binaries=list(dict.fromkeys(x['executable'] for x in artifacts
              if x.get('reason')=='compiler-artifact' and x.get('executable')))
          candidates=[]
          for candidate in binaries:
            path=pathlib.Path(candidate)
            if not path.is_file() or not os.access(path,os.X_OK): continue
            with path.open('rb') as source:
              if source.read(4)!=b'\x7fELF': continue
            result=subprocess.run([str(path),'--list'],capture_output=True,
                                   text=True,timeout=10,check=False)
            if result.returncode!=0: continue
            if all(name in result.stdout for name in (
              'runtime::d148_netns_fixture::hosted_receiver_process_real_udp_tcp_tls_file',
              'runtime::d148_netns_fixture::hosted_sender_process_real_udp_tcp_tls_file')):
              candidates.append(path.resolve())
          print('D148_CARGO_ELF_ARTIFACTS_COUNT='+str(len(binaries)))
          assert len(candidates)==1,{'valid_test_harnesses':candidates,
                                      'cargo_artifacts':binaries}
          with open(sys.argv[2],'a') as out:
            out.write('D148_TEST_BINARY='+str(candidates[0])+'\n')
          print('D148_REAL_TEST_HARNESS_BINARY='+str(candidates[0]))
          PYBIN
      - name: Real received UDP, physical TCP both directions, production TLS/SAS/file/receipt and negative netns tests
        env:
          D148_HOSTED_CI_ONLY: isolated
        shell: bash
        run: |
          set -euo pipefail
          bash .github/scripts/d148-hosted-netns.sh
      - name: Verify fixture remains excluded from compiled release executables
        shell: bash
        run: |
          set -euo pipefail
          cargo build -p opendrop-linux-receiver --bin opendrop-linux-receiver --release --locked
          release_binary=target/release/opendrop-linux-receiver
          test -s "$release_binary"
          release_sha_before="$(sha256sum "$release_binary" | cut -d' ' -f1)"
          if cargo build -p opendrop-linux-receiver --bin opendrop-linux-receiver                --release --locked --features hosted-guest-fixture > "$RUNNER_TEMP/unsafe.log" 2>&1; then
            echo 'CI-only identity/virtual-network fixture leaked into RELEASE!' >&2; exit 1
          else
            unsafe_exit=$?
          fi
          echo "D148_UNSAFE_RELEASE_BUILD_EXIT=$unsafe_exit"
          # Cargo compiles dependencies before the receiver binary. Any of
          # these explicit compile_error! guards can reject the feature first.
          # An unrelated compiler failure must not count as proof of exclusion.
          if ! grep -F -e 'error: hosted-guest-fixture owner-action simulation is forbidden in release builds' \
                     -e 'error: test-only guest approval cannot be linked into release builds' \
                     -e 'error: hosted-guest-fixture is forbidden for production release builds' \
                     "$RUNNER_TEMP/unsafe.log"; then
            echo 'Unsafe release build failed without an expected fixture-exclusion guard:' >&2
            cat "$RUNNER_TEMP/unsafe.log" >&2
            exit 1
          fi
          test "$(sha256sum "$release_binary" | cut -d' ' -f1)" = "$release_sha_before"
          echo "D148_NORMAL_RELEASE_BINARY_SHA256=$release_sha_before"
          echo D148_RELEASE_BUILD_WITH_HOSTED_FIXTURE=BLOCKED
          # NO hosted netns can remain: only the test runner was allowed to
          # create these disposable virtual links.
          remaining="$(sudo ip netns list | grep od148 || true)"
          if test -n "$remaining"; then
            echo "D148_NETNS_CLEANUP_FAILED=$remaining" >&2
            exit 1
          fi
          echo D148_NETNS_CLEANUP=PASS

  android-connected-source-artifact:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          # Ancestor verification needs the accepted D-149 parent history.
          fetch-depth: 0
      - name: Exact source and private exclusion
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/verification/d154-terminal-diagnostics-20261121
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor 27dadd8197a96876d14ba97cb6c51bd8d03553db "$GITHUB_SHA"
          git merge-base --is-ancestor 8a417b9a33dc3fe66f2fc306cf79051a8cc12307 "$GITHUB_SHA"
          test ! -e AGENTS.md && test ! -e .opendrop-private
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d
        with:
          gradle-version: '8.11.1'
      - name: Build production-connected Rust JNI and real normal Android source
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal --component rustfmt
          rustup default stable
          rustup target add aarch64-linux-android x86_64-linux-android
          cargo fmt --all -- --check
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          ndk="$(find "$sdk/ndk" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          bin="$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$bin/aarch64-linux-android26-clang"
          export CARGO_TARGET_X86_64_LINUX_ANDROID_LINKER="$bin/x86_64-linux-android26-clang"
          export CC_aarch64_linux_android="$bin/aarch64-linux-android26-clang"
          export CC_x86_64_linux_android="$bin/x86_64-linux-android26-clang"
          export AR_aarch64_linux_android="$bin/llvm-ar"
          export AR_x86_64_linux_android="$bin/llvm-ar"
          # The deliberate absence of hosted-guest-fixture is a release rule.
          cargo build -p opendrop-android-sender --locked --release --target aarch64-linux-android
          cargo build -p opendrop-android-sender --locked --release --target x86_64-linux-android
          mkdir -p apps/android/build/generated/opendrop-jni/{arm64-v8a,x86_64}
          cp target/aarch64-linux-android/release/libopendrop_android_sender.so apps/android/build/generated/opendrop-jni/arm64-v8a/libopendrop_android_guest.so
          cp target/x86_64-linux-android/release/libopendrop_android_sender.so apps/android/build/generated/opendrop-jni/x86_64/libopendrop_android_guest.so
          for so in apps/android/build/generated/opendrop-jni/{arm64-v8a,x86_64}/libopendrop_android_guest.so; do
            test -s "$so"
            exports="$(readelf --wide --dyn-syms "$so")"
            grep -F Java_org_opendrop_app_GuestNative_sendOne <<< "$exports"
            grep -F Java_org_opendrop_app_GuestNative_sendHotspot <<< "$exports"
            grep -F Java_org_opendrop_app_GuestNative_recoverHotspot <<< "$exports"
            grep -F Java_org_opendrop_app_GuestNative_identitySelfTest <<< "$exports"
          done
          gradle --no-daemon -p apps/android assembleNormalDebug assembleNormalDebugAndroidTest lintNormalDebug
      - name: Enable KVM on disposable GitHub runner only
        shell: bash
        run: |
          test -c /dev/kvm
          sudo chmod 0666 /dev/kvm
      - name: Isolated API 35 real AndroidKeyStore/JNI ART checks (NOT owner phone)
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_5
          ram-size: 2048M
          disk-size: 4096M
          emulator-boot-timeout: 600
          disable-animations: true
          script: |
            bash .github/scripts/s1g-hosted-android.sh
      - name: Prove package/JNI/manifest/signature and retain exact connected APK
        shell: bash
        run: |
          set -euo pipefail
          apk=apps/android/build/outputs/apk/normal/debug/OpenDropAndroid-normal-debug.apk
          test -s "$apk"
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          toolsdir="$(find "$sdk/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          badge="$("$toolsdir/aapt" dump badging "$apk")"
          grep -F "package: name='org.opendrop.app' versionCode='1'" <<< "$badge"
          grep -F "sdkVersion:'26'" <<< "$badge"
          grep -F "targetSdkVersion:'35'" <<< "$badge"
          permissions="$("$toolsdir/aapt" dump permissions "$apk")"
          grep -F "android.permission.INTERNET" <<< "$permissions"
          grep -F "android.permission.ACCESS_NETWORK_STATE" <<< "$permissions"
          if grep -E 'android.permission.(READ_EXTERNAL_STORAGE|WRITE_EXTERNAL_STORAGE|MANAGE_EXTERNAL_STORAGE|QUERY_ALL_PACKAGES)' <<< "$permissions"; then
            echo 'Unapproved broad Android permission present' >&2; exit 1
          fi
          tree="$("$toolsdir/aapt" dump xmltree "$apk" AndroidManifest.xml)"
          grep -F 'org.opendrop.app.ShareIngressActivity' <<< "$tree"
          grep -F 'android.intent.action.SEND' <<< "$tree"
          grep -F 'android.intent.action.SEND_MULTIPLE' <<< "$tree"
          if grep -E 'OfflineSmokeActivity|GuestFixtureProvider|GuestGrantIssuerProvider' <<< "$tree"; then
            echo 'Test-only component in production manifest' >&2; exit 1
          fi
          zipinfo -1 "$apk" | grep -Fx 'lib/arm64-v8a/libopendrop_android_guest.so'
          zipinfo -1 "$apk" | grep -Fx 'lib/x86_64/libopendrop_android_guest.so'
          if unzip -Z -1 "$apk" | grep -E '^lib/.*\.so$' | grep -v -E '^lib/(arm64-v8a|x86_64)/libopendrop_android_guest\.so$'; then
            echo 'Unreviewed JNI library in connected APK' >&2; exit 1
          fi
          "$toolsdir/apksigner" verify --verbose --print-certs "$apk" > "$RUNNER_TEMP/d154-apksigner.txt"
          grep -F 'Verified using v2 scheme (APK Signature Scheme v2): true' "$RUNNER_TEMP/d154-apksigner.txt"
          raw="$(grep -im1 -E '(certificate.*SHA-256|SHA-256.*certificate)' "$RUNNER_TEMP/d154-apksigner.txt")"
          cert="$(printf '%s\n' "$raw" | sed -E 's/.*[Dd]igest: *//' | tr -cd '0-9a-fA-F' | tr 'A-F' 'a-f')"
          test "${#cert}" -eq 64
          out="$RUNNER_TEMP/d154-android-artifact"
          mkdir -p "$out"
          cp "$apk" "$out/OpenDrop-D154-Connected-NOT-APPROVED.apk"
          sha="$(sha256sum "$out/OpenDrop-D154-Connected-NOT-APPROVED.apk" | cut -d' ' -f1)"
          libsha="$(sha256sum apps/android/build/generated/opendrop-jni/arm64-v8a/libopendrop_android_guest.so | cut -d' ' -f1)"
          cat > "$out/D154_ANDROID_PROVENANCE.txt" <<EOF
          source_repository=Suraj-H675/OpenDrop
          source_branch=verification/d154-terminal-diagnostics-20261121
          source_sha=$GITHUB_SHA
          github_actions_run=$GITHUB_RUN_ID
          github_actions_attempt=$GITHUB_RUN_ATTEMPT
          apk_file=OpenDrop-D154-Connected-NOT-APPROVED.apk
          apk_sha256=$sha
          android_signer_certificate_sha256=$cert
          android_package=org.opendrop.app
          version_code=1
          min_sdk=26
          target_sdk=35
          arm64_jni_sha256=$libsha
          signature=GitHub-hosted runner-generated DEBUG key; NOT production-signed
          permissions=INTERNET,ACCESS_NETWORK_STATE; no broad storage permission
          connected_normal_sender=actual ShareIngressActivity and production Rust JNI
          normal_build_hosted_guest_fixture_feature=ABSENT
          protected_android_art=PASS API35 normal app Keystore/JNI/restart/denied hotspot
          personal_phone=NOT TOUCHED
          physical_install=NOT APPROVED; source-only diagnostic CI, never install on owner phone
          EOF
          printf 'D154_APK_SHA256=%s\nD154_CERT_SHA256=%s\n' "$sha" "$cert"
          echo "D154_ANDROID_ARTIFACT=$out/OpenDrop-D154-Connected-NOT-APPROVED.apk" >> "$GITHUB_ENV"
      - name: Retain D154 APK and source-linked provenance (not install approval)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: d154-connected-android-not-approved
          path: |
            ${{ env.D154_ANDROID_ARTIFACT }}
            ${{ runner.temp }}/d154-android-artifact/D154_ANDROID_PROVENANCE.txt
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - name: Attest exact connected APK to GitHub source workflow
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be
        with:
          subject-path: ${{ env.D154_ANDROID_ARTIFACT }}

  linux-native-receiver-artifact:
    runs-on: ubuntu-24.04
    timeout-minutes: 26
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Exact source and private exclusion
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/verification/d154-terminal-diagnostics-20261121
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor 27dadd8197a96876d14ba97cb6c51bd8d03553db "$GITHUB_SHA"
          git merge-base --is-ancestor 8a417b9a33dc3fe66f2fc306cf79051a8cc12307 "$GITHUB_SHA"
          test ! -e AGENTS.md && test ! -e .opendrop-private
      - name: Build normal optimized Linux receiver and native Qt consent
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal --component rustfmt
          rustup default stable
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends qt6-base-dev libsystemd-dev
          cargo fmt --all -- --check
          cargo test -p opendrop-linux-receiver --bin opendrop-linux-receiver --locked
          cargo build -p opendrop-linux-receiver --bin opendrop-linux-receiver --locked --release
          cmake -S apps/linux/receiver/ui -B "$RUNNER_TEMP/d154-qt" -DOPENDROP_BUILD_QT_TESTS=ON
          cmake --build "$RUNNER_TEMP/d154-qt" --parallel 2
          ctest --test-dir "$RUNNER_TEMP/d154-qt" --output-on-failure
      - name: Enforce release fixture exclusion and record executable dependencies
        shell: bash
        run: |
          set -euo pipefail
          release=target/release/opendrop-linux-receiver
          test -s "$release"
          readelf -h "$release" | grep -F 'Advanced Micro Devices X86-64'
          dependencies="$(ldd "$release")"
          printf '%s\n' "$dependencies"
          if grep -F 'not found' <<< "$dependencies"; then
            echo 'Linux release executable has an unresolved native dependency' >&2; exit 1
          fi
          before="$(sha256sum "$release" | cut -d' ' -f1)"
          if cargo build -p opendrop-linux-receiver --bin opendrop-linux-receiver --locked --release --features hosted-guest-fixture > "$RUNNER_TEMP/d154-unsafe.log" 2>&1; then
            echo 'TEST OWNER/VETH SIMULATION LINKED INTO RELEASE' >&2; exit 1
          else
            result=$?
          fi
          test "$result" -ne 0
          if ! grep -F -e 'error: hosted-guest-fixture owner-action simulation is forbidden in release builds' \
                     -e 'error: test-only guest approval cannot be linked into release builds' \
                     -e 'error: hosted-guest-fixture is forbidden for production release builds' \
                     "$RUNNER_TEMP/d154-unsafe.log"; then
            cat "$RUNNER_TEMP/d154-unsafe.log" >&2
            exit 1
          fi
          test "$(sha256sum "$release" | cut -d' ' -f1)" = "$before"
          out="$RUNNER_TEMP/d154-linux-artifact"
          mkdir -p "$out"
          cp "$release" "$out/opendrop-linux-receiver-D154-ubuntu24-x86_64"
          cat > "$out/D154_LINUX_PROVENANCE.txt" <<EOF
          source_repository=Suraj-H675/OpenDrop
          source_branch=verification/d154-terminal-diagnostics-20261121
          source_sha=$GITHUB_SHA
          github_actions_run=$GITHUB_RUN_ID
          github_actions_attempt=$GITHUB_RUN_ATTEMPT
          linux_binary_file=opendrop-linux-receiver-D154-ubuntu24-x86_64
          linux_binary_sha256=$before
          linux_build_host=Ubuntu 24.04 x86_64 native Qt6+systemd, Rust release
          linux_rust_target=x86_64-unknown-linux-gnu
          hosted_guest_fixture=REJECTED_BY_INTENTIONAL_COMPILE_ERROR
          native_qt_consent_tests=PASS on hosted runner only
          physical_arch_gui_test=NOT PERFORMED; dynamic ABI/runtime must pass gate
          one_time_identity=explicit --guest-ephemeral-once explicit; OS CSPRNG RAM-only P256
          owner_local_listener=NOT STARTED
          EOF
          printf 'D154_LINUX_BINARY_SHA256=%s\nD154_UNSAFE_RELEASE_EXIT=%s\n' "$before" "$result"
          echo "D154_LINUX_ARTIFACT=$out/opendrop-linux-receiver-D154-ubuntu24-x86_64" >> "$GITHUB_ENV"
      - name: Retain D154 Linux owner receiver and exact provenance
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: d154-linux-receiver-not-executed
          path: |
            ${{ env.D154_LINUX_ARTIFACT }}
            ${{ runner.temp }}/d154-linux-artifact/D154_LINUX_PROVENANCE.txt
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - name: Attest exact native Linux receiver to GitHub source workflow
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be
        with:
          subject-path: ${{ env.D154_LINUX_ARTIFACT }}

  windows-native-contract-regression:
    runs-on: windows-2022
    timeout-minutes: 18
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify branch provenance and native Windows wire/security contract
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_REF -ne 'refs/heads/verification/d154-terminal-diagnostics-20261121') { throw 'wrong ref' }
          if ((git rev-parse HEAD) -ne $env:GITHUB_SHA) { throw 'wrong source revision' }
          git merge-base --is-ancestor 8a417b9a33dc3fe66f2fc306cf79051a8cc12307 $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { throw 'D-154 reviewed patch ancestor absent' }
          if (Test-Path AGENTS.md) { throw 'private AGENTS file present' }
          if (Test-Path .opendrop-private) { throw 'private sources present' }
          rustup toolchain install stable --profile minimal --component rustfmt
          rustup default stable
          cargo test -p opendrop-core --locked
          if ($LASTEXITCODE -ne 0) { throw 'Windows CNG/wire regression' }
          cmake -S apps/windows/explorer -B "$env:RUNNER_TEMP/OpenDropExplorer" -G 'Visual Studio 17 2022' -A x64
          if ($LASTEXITCODE -ne 0) { throw 'Explorer CMake config failed' }
          cmake --build "$env:RUNNER_TEMP/OpenDropExplorer" --config Release --parallel 2
          if ($LASTEXITCODE -ne 0) { throw 'Explorer compilation failed' }
          if (!(Test-Path "$env:RUNNER_TEMP/OpenDropExplorer/Release/OpenDropExplorer.dll")) { throw 'Explorer DLL missing' }
