name: S1-D Android guest sender and Linux interoperability verification

on:
  push:
    branches:
      - verification/s1d-android-guest-20261114

permissions:
  contents: read

jobs:
  locked-dependencies:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # reviewed v4.2.2
        with:
          persist-credentials: false
      - name: Require intended verification branch and exact SHA
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = "push"
          test "$GITHUB_REF" = "refs/heads/verification/s1d-android-guest-20261114"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Install isolated runner Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt
          rustup default stable
      - name: Enforce committed Android JNI dependency lock
        shell: bash
        run: |
          set -euo pipefail
          # First bootstrap resolves JNI dependencies only on GitHub runner;
          # print the public lockfile and stop until committed exactly.
          cargo metadata --format-version 1 > "$RUNNER_TEMP/opendrop-metadata.json"
          if ! git diff --exit-code -- Cargo.lock > /dev/null; then
            echo "S1D_CARGO_LOCK_BEGIN"
            base64 -w0 Cargo.lock
            printf '\nS1D_CARGO_LOCK_END\n'
            exit 1
          fi
          cargo metadata --locked --format-version 1 --no-deps >/dev/null

  linux-interop:
    needs: locked-dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Set up Rust and Qt only inside disposable runner
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt
          rustup default stable
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends qt6-base-dev libsystemd-dev
      - name: Verify Rust formatting
        run: cargo fmt --all -- --check
      - name: Test portable Android sender, original shared and Linux units
        run: cargo test -p opendrop-android-sender -p opendrop-core -p opendrop-linux-receiver --locked
      - name: Native Android Rust sender to real Linux guest dispatcher
        run: cargo test -p opendrop-linux-receiver --bin opendrop-linux-receiver --features hosted-guest-fixture --locked
      - name: Link actual Linux production executable without fixtures
        run: cargo build -p opendrop-linux-receiver --bin opendrop-linux-receiver --locked
      - name: Headless native Qt owner controls
        run: |
          cmake -S apps/linux/receiver/ui -B "$RUNNER_TEMP/opendrop-qt-s1d" -DOPENDROP_BUILD_QT_TESTS=ON -DCMAKE_BUILD_TYPE=Debug
          cmake --build "$RUNNER_TEMP/opendrop-qt-s1d" --parallel 2
          ctest --test-dir "$RUNNER_TEMP/opendrop-qt-s1d" --output-on-failure

  android-arm64-source:
    needs: locked-dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Runner-local Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Runner-local Gradle 8.11.1
        uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
        with:
          gradle-version: '8.11.1'
      - name: Rust ARM64 Android target on disposable runner
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add aarch64-linux-android
          printf 'Android SDK: %s\n' "${ANDROID_HOME:-unknown}"
      - name: Configure Android NDK cross compiler
        shell: bash
        run: |
          set -euo pipefail
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$sdk"
          ndk="$(find "$sdk/ndk" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          test -n "$ndk"
          bin="$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin"
          test -x "$bin/aarch64-linux-android26-clang"
          {
            echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$bin/aarch64-linux-android26-clang"
            echo "CC_aarch64_linux_android=$bin/aarch64-linux-android26-clang"
            echo "AR_aarch64_linux_android=$bin/llvm-ar"
          } >> "$GITHUB_ENV"
      - name: Link actual ARM64 JNI Rust protocol and Keystore bridge
        run: cargo build -p opendrop-android-sender --target aarch64-linux-android --release --locked
      - name: Package JNI library without committing binaries
        shell: bash
        run: |
          set -euo pipefail
          library="target/aarch64-linux-android/release/libopendrop_android_sender.so"
          test -s "$library"
          mkdir -p apps/android/build/generated/opendrop-jni/arm64-v8a
          cp "$library" apps/android/build/generated/opendrop-jni/arm64-v8a/libopendrop_android_guest.so
          file "$library"
      - name: Compile APK and static lint; never install
        run: gradle --no-daemon -p apps/android assembleDebug lintDebug
      - name: Verify APK contains actual ARM64 guest engine
        shell: bash
        run: |
          set -euo pipefail
          apk="apps/android/build/outputs/apk/debug/android-debug.apk"
          test -s "$apk"
          unzip -l "$apk" | grep -F 'lib/arm64-v8a/libopendrop_android_guest.so'
          echo 'HOSTED ONLY: debug source build; no emulator, phone or Keystore attestation.'
