[package]
name = "opendrop-linux-receiver"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
opendrop-core = { path = "../../../crates/opendrop-core", features = ["linux-qt-consent"] }
rustls = { version = "=0.23.45", default-features = false, features = ["std", "ring"] }

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "=1.1.4", features = ["fs", "process"] }
sha2 = "=0.10.9"

[dev-dependencies]
tempfile = "=3.27.0"
rusqlite = { version = "=0.40.2", features = ["bundled"] }
