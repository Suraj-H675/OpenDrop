[package]
name = "opendrop-linux-receiver"
version = "0.1.0"
edition = "2021"
publish = false

[features]
hosted-guest-fixture = ["opendrop-core/hosted-guest-fixture"]

[dependencies]
opendrop-core = { path = "../../../crates/opendrop-core", features = ["linux-qt-consent"] }
rustls = { version = "=0.23.45", default-features = false, features = ["std", "ring"] }

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "=1.1.4", features = ["fs", "process"] }
sha2 = "=0.10.9"
cryptoki = "=0.12.1"

[dev-dependencies]
tempfile = "=3.27.0"
rusqlite = { version = "=0.40.2", features = ["bundled"] }
ring = "=0.17.14"
opendrop-android-sender = { path = "../../../crates/opendrop-android-sender", features = ["hosted-guest-fixture"] }
