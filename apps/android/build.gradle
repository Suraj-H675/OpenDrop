plugins {
    id 'com.android.application' version '8.9.2'
    id 'org.jetbrains.kotlin.android' version '2.0.20'
}

android {
    namespace 'org.opendrop.app'
    compileSdk 35

    defaultConfig {
        applicationId 'org.opendrop.app'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main {
            // Native guest engine is built into an IGNORED generated folder
            // by isolated Android CI, never checked in as a test library.
            jniLibs.srcDirs = ['build/generated/opendrop-jni']
        }
    }
}

tasks.named('preBuild') {
    doFirst {
        def nativeLibrary = file('build/generated/opendrop-jni/arm64-v8a/libopendrop_android_guest.so')
        if (!nativeLibrary.isFile() || nativeLibrary.length() < 1024L) {
            throw new GradleException('Android guest app requires the real Rust arm64 JNI engine; no mock/software fallback')
        }
    }
}
